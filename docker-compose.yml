services:

  ring-django:
    build: .
    container_name: ring-django
    ports:
      - "8002:8000"
    env_file:
      - .env
    volumes:
      - .:/app

  ring-token-refresh:
    build: .
    container_name: ring-token-refresh
    env_file:
      - .env
    volumes:
      - .:/app
    command: >-
      sh -c "while true; do
      python manage.py refresh_ring_token || true;
      sleep 240;
      done"
    depends_on:
      - ring-django

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ring-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - ring-django
