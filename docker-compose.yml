services:

  ring-django:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen(\"http://127.0.0.1:8000/\",timeout=4).status==200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    build: .
    container_name: ring-django
    ports:
      - "8002:8000"
    env_file:
      - .env
    environment:
      RING_MOBILE_RELEASES: >-
        [{"version":"0.0.1","android":"ring-alert-viewer-0.0.1.apk","ios":""}]
    volumes:
      - .:/app

  ring-token-refresh:
    restart: unless-stopped
    build: .
    container_name: ring-token-refresh
    env_file:
      - .env
    volumes:
      - .:/app
    command: >-
      sh -c "while true; do
      python manage.py refresh_ring_token || true;
      sleep 240;
      done"
    depends_on:
      ring-django:
        condition: service_healthy

  cloudflared:
    restart: unless-stopped
    image: cloudflare/cloudflared:latest
    container_name: ring-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      ring-django:
        condition: service_healthy
